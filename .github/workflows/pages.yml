# Živý náhled webu na GitHub Pages (https://<uživatel>.github.io/<repo>/).
# Při každé změně v main se web vykreslí s výchozím obsahem ze schema.sql
# a zveřejní jako statická stránka. Je to jen NÁHLED — administrace,
# ukládání a formulář vyžadují PHP + MySQL hosting.
name: Náhled na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite

      - name: Vykreslit web do statického náhledu
        run: python3 -I tools/build-preview.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
